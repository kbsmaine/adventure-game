<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quarantine Streets - Graveyard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="char-screen" class="screen">
    <h1>🧟 Quarantine Graveyard</h1>
    <p>Pick your survivor and enter the zone.</p>
    <label>
      Name:
      <input id="hero-name" type="text" placeholder="Riley" maxlength="14" />
    </label>
    <p class="label">Survivor presets</p>
    <div id="character-grid" class="character-grid"></div>
    <button id="start-btn">Enter Graveyard</button>
  </div>

  <div id="game-screen" class="screen">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <span id="hud-name"></span>
      <span id="hud-class"></span>
      <span id="hud-item"></span>
      <span id="hud-level"></span>
      <span id="hud-hp"></span>
    </div>
    <div id="interact-box" class="hidden">Press E</div>
    <div id="death-screen" class="hidden">
      <h2>You died</h2>
      <button id="retry-btn">Retry</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
