<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quarantine Streets</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="char-screen" class="screen">
    <h1>🧟 Quarantine Streets</h1>
    <p>Pick your survivor and enter the zone.</p>
    <label>
      Name:
      <input id="hero-name" type="text" placeholder="Riley" maxlength="14" />
    </label>

    <p class="label">Survivor presets</p>
    <div id="character-grid" class="character-grid"></div>

    <button id="start-btn">Enter Streets</button>
  </div>

  <div id="game-screen" class="screen">
    <canvas id="game-canvas" width="960" height="540"></canvas>
    <div id="hud">
      <span id="hud-name"></span>
      <span id="hud-class"></span>
    </div>
    <div id="interact-box" class="hidden">Press E to talk</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
